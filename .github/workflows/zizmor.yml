name: zizmor

# Advisory GitHub Actions security audit (all severities, log output only).
# Never blocks and stays green: step-level continue-on-error (findings make
# zizmor exit non-zero), job-level continue-on-error, not a required check.
# Findings are in the step log and in the job summary. No SARIF upload on
# purpose (advanced-security: false), so no security-events: write and no
# code-scanning alerts that would duplicate the blocking medium+ zizmor step
# in quality.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run zizmor (advisory)
        id: zizmor
        continue-on-error: true
        # zizmorcore/zizmor-action@v0.8.0
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          advanced-security: false
          min-severity: informational
          version: 1.31.1

      - name: Findings to job summary
        if: always()
        env:
          OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          out="${RUNNER_TEMP}/zizmor"
          {
            echo "## zizmor (advisory, never blocks)"
            echo
            echo "zizmor step outcome: \`${OUTCOME}\` (failure = findings present)"
            echo
            if [ -s "$out" ]; then
              echo '```'
              sed -E 's/\x1b\[[0-9;]*m//g' "$out"
              echo '```'
            else
              echo "No output captured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

