name: Scorecard

# OpenSSF Scorecard: supply-chain posture, results into code scanning.

on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]
    paths:
      - '.github/**'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Scorecard
        # ossf/scorecard-action@v2.5.0
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        # github/codeql-action/upload-sarif (same pin as codeql.yml)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: results.sarif
