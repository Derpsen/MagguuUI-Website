name: Docker security scan

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - nuxt.config.ts
      - server/cli/**
      - server/utils/metaSyncCli.ts
      - server/utils/metaSyncCliHeap.ts
      - server/utils/blizzardMetaHeap.ts
      - server/utils/blizzardMetaSync.ts
      - server/utils/blizzardMetaLock.ts
      - server/database/metaSyncLockSql.ts
      - tools/build-meta-sync-cli.mjs
      - tests/unit/metaSyncCliHeap.test.ts
      - tests/unit/blizzardMetaSync.prespec-heap.test.ts
      - tests/fixtures/blizzard-meta/**
      - .github/workflows/docker-scan.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load only, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: scan-target:latest
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Meta sync CLI (no credentials, expect skipped)
        run: |
          set +e
          out=$(docker run --rm -e NODE_OPTIONS='--enable-source-maps --max-old-space-size=640' scan-target:latest node .output/server/meta-sync-cli.mjs)
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "exit=$rc"
          test "$rc" -eq 4
          printf '%s\n' "$out" | tail -n 1 | jq -e '.status == "skipped" and .http429 == 0 and (.reason | test("NUXT_BLIZZARD_CLIENT_ID"))'
          rss=$(printf '%s\n' "$out" | tail -n 1 | jq -r '.peakRssBytes')
          heap=$(printf '%s\n' "$out" | tail -n 1 | jq -r '.peakHeapUsedBytes')
          echo "start rss=$rss heap=$heap"
          test "$rss" -lt 157286400
          test "$heap" -lt 52428800

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Probe Meta pre-spec peak heap
        run: |
          npm ci
          set +e
          out=$(env NODE_ENV=test node --expose-gc --max-old-space-size=256 --import tsx tests/fixtures/blizzard-meta/runPreSpecHeap.ts)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          line=$(printf '%s\n' "$out" | tail -n 1)
          peak=$(printf '%s\n' "$line" | jq -r '.peakHeapBytes')
          rss=$(printf '%s\n' "$line" | jq -r '.rssAfterGcBytes')
          kept=$(printf '%s\n' "$line" | jq -r '.candidates')
          echo "pre-spec peak heap=$peak rss=$rss kept=$kept (budget heap<188743680 rss<314572800 kept<=32000)"
          test "$peak" -lt 188743680
          test "$rss" -lt 314572800
          test "$kept" -le 32000

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload SARIF to Security tab
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker
