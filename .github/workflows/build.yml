name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The required check `build (26, false)` is the aggregator job at the bottom: it only passes when
  # `checks` and BOTH Playwright shards (together = the full suite) passed. Never rename it.
  checks:
    name: checks (audit, lint, unit, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_OG_IMAGE_SECRET: ci-dummy-og-image-secret

    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NUXT_JWT_SECRET: ci-dummy-secret-must-be-32-chars-long-XXXXXXXXXX
          NUXT_ADMIN_PASSWORD: ci-dummy

      - run: npm run verify:smoke

  e2e:
    # Playwright suite split in two halves (--shard=N/2 splits by spec file; 107 + 104 = all 211 tests).
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NUXT_OG_IMAGE_SECRET: ci-dummy-og-image-secret
      SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npm run test:install

      - name: Playwright smoke tests (shard ${{ matrix.shard }}/2)
        run: npm test -- --shard="${SHARD}/2"

  build:
    # Aggregator with the exact name of the required check (`build (26, false)`).
    # !cancelled() instead of success(): a failed need must FAIL this job, never skip it (a skipped required check passes).
    needs: [checks, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 26
            experimental: false
    steps:
      - name: All parts must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  alarm:
    # Failure alarm to the escalation webhook (main only; silent without secrets; never fails the run).
    # Template: failure-alarm.yml. Dedupe: one per run, none if the same workflow already failed on this commit.
    name: failure alarm
    needs: [checks, e2e, build]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/failure-alarm.yml
    secrets:
      ESCALATION_WEBHOOK_URL: ${{ secrets.ESCALATION_WEBHOOK_URL }}
      ESCALATION_BEARER: ${{ secrets.ESCALATION_BEARER }}
