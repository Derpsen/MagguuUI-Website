name: Lighthouse (live)

# Weekly Lighthouse / Web Vitals snapshot of the production site (real data,
# real network path, all four categories). Advisory only: the job never fails
# and has no failure-alarm. The per-PR budget check on a local production build
# lives in lighthouse.yml; this one covers what only the live site can show.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Run Lighthouse against ui.magguu.xyz
        id: lh
        # treosh/lighthouse-ci-action@12.6.2
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          urls: |
            https://ui.magguu.xyz/
            https://ui.magguu.xyz/guide
            https://ui.magguu.xyz/changelog
            https://ui.magguu.xyz/strings
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-live

      - name: Job summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          // Read the LHCI results folder directly (the action's `manifest` output is
          // not declared in its action.yml).
          let manifest = []
          try {
            manifest = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8')).filter(r => r.isRepresentativeRun)
          } catch (error) {
            console.log(`::warning title=Lighthouse live::No Lighthouse results found: ${error.message}`)
          }
          const pct = v => (v == null ? '–' : Math.round(v * 100))
          const ms = v => (v == null ? '–' : `${Math.round(v)} ms`)
          const lines = [
            '## Lighthouse (live, mobile, median of 3)',
            '',
            '| URL | Perf | A11y | BP | SEO | LCP | CLS | TBT | FCP | TTFB |',
            '|---|---|---|---|---|---|---|---|---|---|',
          ]
          for (const run of manifest) {
            const lhr = JSON.parse(fs.readFileSync(run.jsonPath, 'utf8'))
            const a = lhr.audits
            const s = run.summary
            lines.push(`| ${run.url} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s['best-practices'])} | ${pct(s.seo)} | ${ms(a['largest-contentful-paint']?.numericValue)} | ${(a['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3)} | ${ms(a['total-blocking-time']?.numericValue)} | ${ms(a['first-contentful-paint']?.numericValue)} | ${ms(a['server-response-time']?.numericValue)} |`)
          }
          const out = lines.join('\n') + '\n'
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out)
          console.log(out)
          NODE
