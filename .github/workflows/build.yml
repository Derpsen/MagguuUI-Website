name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 26
            experimental: false
    env:
      NUXT_OG_IMAGE_SECRET: ci-dummy-og-image-secret

    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NUXT_JWT_SECRET: ci-dummy-secret-must-be-32-chars-long-XXXXXXXXXX
          NUXT_ADMIN_PASSWORD: ci-dummy

      - run: npm run verify:smoke

      - name: Install Playwright browser
        run: npm run test:install

      - name: Playwright smoke tests
        run: npm test

      - name: Upload public build
        if: matrix.node == 24
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public
          path: .output/public
          retention-days: 7

  alarm:
    # Failure alarm to the escalation webhook (main only; silent without secrets; never fails the run).
    # Template: failure-alarm.yml. Dedupe: one per run, none if the same workflow already failed on this commit.
    name: failure alarm
    needs: [build]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
    uses: ./.github/workflows/failure-alarm.yml
    secrets:
      ESCALATION_WEBHOOK_URL: ${{ secrets.ESCALATION_WEBHOOK_URL }}
      ESCALATION_BEARER: ${{ secrets.ESCALATION_BEARER }}
