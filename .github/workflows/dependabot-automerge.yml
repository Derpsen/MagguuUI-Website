name: Dependabot auto-merge

# Since 2026-10-26 Renovate owns the version updates (renovate.json; it merges its own PRs after green CI).
# Dependabot version updates are off (open-pull-requests-limit 0), so this workflow only sees Dependabot
# SECURITY PRs. It ignores every other author (renovate[bot] PRs are never touched here).
# Patch + minor Dependabot PRs get auto-merge (squash). Majors never.
# Security-update PRs (repo setting on since 2026-10-23) skip grouping/cooldown
# on purpose but go through the same gate: fetch-metadata still reports
# update-type version-update:semver-*, so a security patch/minor is labelled and
# auto-merged after CI, and a security major waits for a human.
# Merge path: `gh pr merge --auto` only. GitHub then waits for ALL required checks on main
# (`build (26, false)` and `Analyze (javascript-typescript)`) and merges itself. There is no
# fallback merge job any more (it merged on Build success alone, ignoring CodeQL, and needed
# contents/actions write for a path that is dead while auto-merge + required checks are on).
# If auto-merge or required checks are ever off, the `enable` job only prints a notice and a human merges.
# Token rights (Scorecard Token-Permissions): top-level `permissions: {}`; the two job-level writes left
# are the minimum: `enable` needs contents + pull-requests write for the enablePullRequestAutoMerge
# mutation (+ issues write for the label), `post-merge-dispatch` needs actions write for `gh workflow run`
# (a GITHUB_TOKEN merge does not start push workflows, only workflow_dispatch). Guarded by
# tools/dependabot-automerge.test.py (Quality, pre-push).

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run
    types: [opened, reopened, synchronize, closed]

permissions: {}

jobs:
  enable:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # dependabot/fetch-metadata@v3.1.0
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label patch/minor updates
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create dependabot-auto-merge --repo "$REPO" --color 1f883d --description "Auto-merge once CI passes" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label dependabot-auto-merge

      - name: Enable auto-merge (only if repo settings make it wait for CI)
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          allow=$(gh api "repos/$REPO" --jq '.allow_auto_merge')
          classic=$(gh api "repos/$REPO/branches/main" --jq '.protection.required_status_checks.contexts | length' 2>/dev/null || echo 0)
          rules=$(gh api "repos/$REPO/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length' 2>/dev/null || echo 0)
          if [ "$allow" != "true" ] || { [ "${classic:-0}" -eq 0 ] && [ "${rules:-0}" -eq 0 ]; }; then
            echo "::notice::Auto-merge not enabled (allow_auto_merge=$allow, required checks classic=$classic rules=$rules); falling back to merge after Build success."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"

  # For merges by a real user / auto-merge (closed event does fire then).
  post-merge-dispatch:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch main workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for wf in docker.yml build.yml codeql.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref main
          done
