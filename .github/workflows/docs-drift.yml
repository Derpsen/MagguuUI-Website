name: Docs drift

# Docs drift check: tools/docs-drift.sh scans docs against the regex rules in .github/docs-drift-rules.txt.
# Mode (repository variable DOCS_DRIFT_MODE, default "issue"):
#   issue  weekly + manual run; hits create/update ONE open issue "Docs-Drift", a clean run closes it. Never fails the run.
#   warn   every push/PR + weekly; hits become ::warning annotations, the run stays green.
#   fail   every push/PR + weekly; hits fail the run (use once the rules are free of false positives).
# Config/usage errors (exit 2) always fail the run. Optional repository variable DOCS_DRIFT_ASSIGNEE assigns the issue.

on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs-drift:
    # In issue mode push/PR runs are skipped (the weekly schedule and manual runs do the work).
    if: ${{ (vars.DOCS_DRIFT_MODE || 'issue') != 'issue' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ vars.DOCS_DRIFT_MODE || 'issue' }}
    steps:
      - name: Checkout repository
        # Pin to a full commit SHA of the checkout release you use (example: actions/checkout v7).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run docs-drift
        id: drift
        run: |
          set +e
          bash tools/docs-drift.sh > drift.txt 2> drift.err
          rc=$?
          set -e
          cat drift.txt drift.err
          if [ "$rc" -ge 2 ]; then echo "::error::docs-drift config/fetch error"; exit "$rc"; fi
          echo "hits=$([ "$rc" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Warn mode, annotate hits
        if: steps.drift.outputs.hits == 'true' && env.MODE == 'warn'
        run: |
          while IFS= read -r l; do echo "::warning title=Docs drift::$l"; done < drift.txt

      - name: Fail mode, fail the run on hits
        if: steps.drift.outputs.hits == 'true' && env.MODE == 'fail'
        run: |
          echo "::error::docs drift found (see log)"; exit 1

      - name: Create or update Docs-Drift issue
        if: steps.drift.outputs.hits == 'true' && env.MODE == 'issue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.DOCS_DRIFT_ASSIGNEE }}
        run: |
          {
            echo "Docs drift found by \`tools/docs-drift.sh\` (rules: \`.github/docs-drift-rules.txt\`)."
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo
            echo "Fix the docs, or tune the rules for a false positive. Run: $RUN_URL"
          } > body.md
          num=$(gh issue list --repo "$REPO" --state open --search 'in:title "Docs-Drift"' --json number,title \
            --jq '[.[] | select(.title == "Docs-Drift")][0].number // empty')
          assignee=(); [ -n "$ASSIGNEE" ] && assignee=(--assignee "$ASSIGNEE")
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$REPO" --body-file body.md "${assignee[@]}"
          else
            gh issue create --repo "$REPO" --title "Docs-Drift" --body-file body.md "${assignee[@]}"
          fi

      - name: Close Docs-Drift issue when clean
        if: steps.drift.outputs.hits == 'false' && env.MODE == 'issue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list --repo "$REPO" --state open --search 'in:title "Docs-Drift"' --json number,title \
            --jq '.[] | select(.title == "Docs-Drift") | .number' | while read -r num; do
            gh issue close "$num" --repo "$REPO" --comment "Docs drift check is clean again (${GITHUB_SHA::7})."
          done
