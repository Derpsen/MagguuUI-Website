name: Drift

# Product-drift guard (tools/magguu-drift.py, stdlib only, no network, ~0.3 s).
# Deliberately NO paths-ignore: quality.yml skips **/*.md, but docs are exactly
# where copy drift (retired addon names, starter/optional packs, button label)
# shows up. Exit 1 only on ERROR; WARN annotations (locked-major transitives)
# never fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Drift guard
        run: python3 tools/magguu-drift.py --repo website --allow tools/drift-allow.txt --gha

  alarm:
    # Failure alarm to the escalation webhook (main only; silent without secrets; never fails the run).
    # Template: failure-alarm.yml. Dedupe: one per run, none if the same workflow already failed on this commit.
    name: failure alarm
    needs: [drift]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/failure-alarm.yml
    secrets:
      ESCALATION_WEBHOOK_URL: ${{ secrets.ESCALATION_WEBHOOK_URL }}
      ESCALATION_BEARER: ${{ secrets.ESCALATION_BEARER }}
