name: Link check (live)

# Weekly broken-link check of ui.magguu.xyz. Report as artifact + job summary.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26

      - name: Check links
        run: node scripts/check-links.mjs
        env:
          BASE_URL: https://ui.magguu.xyz

      - name: Job summary
        if: always()
        run: if [ -f link-report.md ]; then cat link-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: link-report
          path: link-report.*
          retention-days: 30
