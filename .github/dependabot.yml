version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      nuxt-stack:
        patterns:
          - nuxt
          - "@nuxt/*"
          - nitropack
          - h3
        update-types:
          - minor
          - patch
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - "@playwright/*"
          - playwright
          - typescript
          - tsx
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - satori
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: h3
        versions:
          - "2.x"
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # satori 0.x minors are breaking; held below 0.41 (see AGENTS.md)
      - dependency-name: satori
        versions:
          - ">=0.41.0"
      - dependency-name: js-yaml
        versions:
          - ">=5.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
        update-types:
          - minor
          - patch
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    ignore:
      # Node 26 needs Marco's explicit yes
      - dependency-name: node
        versions:
          - ">=26"
