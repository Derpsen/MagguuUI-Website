name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # github/codeql-action/init@v4.39.1
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v4.39.1
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{ matrix.language }}"

  alarm:
    # Failure alarm to the escalation webhook (main only; silent without secrets; never fails the run).
    # Template: failure-alarm.yml. Dedupe: one per run, none if the same workflow already failed on this commit.
    name: failure alarm
    needs: [analyze]
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/failure-alarm.yml
    secrets:
      ESCALATION_WEBHOOK_URL: ${{ secrets.ESCALATION_WEBHOOK_URL }}
      ESCALATION_BEARER: ${{ secrets.ESCALATION_BEARER }}
