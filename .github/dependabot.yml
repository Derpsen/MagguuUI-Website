version: 2

# Since 2026-10-26 Renovate (renovate.json) owns the version updates.
# open-pull-requests-limit: 0 switches Dependabot VERSION updates off; Dependabot SECURITY updates
# (repository setting, on since 2026-10-23) still open PRs and are handled by dependabot-automerge.yml.
# The ignore rules below mirror the locks in renovate.json (reasons there), so a security PR never
# proposes a locked major either.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: h3
        versions:
          - "2.x"
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: satori
        versions:
          - ">=0.48.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
